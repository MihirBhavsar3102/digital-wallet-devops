# Install once with `pip install pre-commit` and `pre-commit install`. Needs terraform, tflint
# (run `tflint --init` once) and gitleaks on the PATH. CI runs the same checks in step 2.2.
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.4
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  # Local hook, so it uses the gitleaks you already have instead of building one. It only scans the
  # staged changes; the full history is scanned in CI against .gitleaks-baseline.json.
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
