# Structured access log, one JSON object per line on stdout (docker logs / CloudWatch).
log_format json_combined escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
  '"request_time":$request_time,"user_agent":"$http_user_agent",'
  '"x_forwarded_for":"$http_x_forwarded_for"}';

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /dev/stdout json_combined;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: anything that is not a file falls back to the app.
    # There is no /api proxy here on purpose: the load balancer sends /api/* to the backend
    # before a request reaches this container.
    location / {
        try_files $uri /index.html;
    }
}
